
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ứng dụng thay đổi kích thước ảnh</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f6f8;
    }

    .container {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0001;
    }

    h1 {
      text-align: center;
      color: #234;
    }

    label {
      display: block;
      margin-top: 16px;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin-top: 6px;
    }

    button {
      border: 0;
      border-radius: 6px;
      background: #1769e0;
      color: white;
      cursor: pointer;
      margin-top: 20px;
    }

    img {
      max-width: 100%;
      margin-top: 20px;
    }

    #status {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Thay đổi kích thước ảnh</h1>

    <label for="imageFile">Chọn ảnh:</label>
    <input type="file" id="imageFile" accept="image/*">

    <label for="width">Chiều rộng (pixel):</label>
    <input type="number" id="width" min="1" value="800">

    <label for="height">Chiều cao (pixel):</label>
    <input type="number" id="height" min="1" value="600">

    <button id="resizeButton">Thay đổi kích thước</button>

    <p id="status"></p>

    <h3>Ảnh kết quả</h3>
    <img id="resultImage" alt="Ảnh sau khi xử lý" hidden>
    <p><a id="downloadLink" hidden download="anh-da-chinh.jpg">
      Tải ảnh đã xử lý
    </a></p>
  </div>

  <script>
    const imageFile = document.getElementById("imageFile");
    const widthInput = document.getElementById("width");
    const heightInput = document.getElementById("height");
    const resizeButton = document.getElementById("resizeButton");
    const statusText = document.getElementById("status");
    const resultImage = document.getElementById("resultImage");
    const downloadLink = document.getElementById("downloadLink");

    resizeButton.addEventListener("click", async () => {
      const file = imageFile.files[0];
      const width = Number(widthInput.value);
      const height = Number(heightInput.value);

      if (!file) {
        statusText.textContent = "Vui lòng chọn một ảnh.";
        return;
      }

      if (!Number.isInteger(width) || !Number.isInteger(height)
          || width < 1 || height < 1) {
        statusText.textContent = "Chiều rộng và chiều cao phải lớn hơn 0.";
        return;
      }

      try {
        statusText.textContent = "Đang xử lý ảnh...";
        resizeButton.disabled = true;

        const base64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            resolve(reader.result.split(",")[1]);
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });

        const response = await fetch("/api/resize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64, width, height })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Không thể xử lý ảnh.");
        }

        const imageUrl = "data:" + data.contentType
          + ";base64," + data.image;

        resultImage.src = imageUrl;
        resultImage.hidden = false;
        downloadLink.href = imageUrl;
        downloadLink.hidden = false;
        statusText.textContent = "Đã xử lý ảnh thành công!";
      } catch (error) {
        statusText.textContent = "Lỗi: " + error.message;
      } finally {
        resizeButton.disabled = false;
      }
    });
  </script>
</body>
</html>
